name: Deploy — Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy-api-prod:
    name: Deploy API to Production (Cloud Run)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push Docker image
        run: |
          gcloud builds submit api-server/ \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/pickafriend-api:${{ github.ref_name }}

      - name: Deploy to Cloud Run (prod)
        run: |
          gcloud run deploy pickafriend-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/pickafriend-api:${{ github.ref_name }} \
            --region europe-west1 \
            --platform managed \
            --min-instances 1 \
            --max-instances 10 \
            --set-env-vars DATABASE_URL=${{ secrets.PROD_DATABASE_URL }} \
            --set-env-vars FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --set-env-vars STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }} \
            --set-env-vars STRIPE_WEBHOOK_SECRET=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }} \
            --allow-unauthenticated

  deploy-functions-prod:
    name: Deploy Cloud Functions to Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api-prod
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm ci && npm run build
      - name: Deploy functions to prod
        run: |
          npx firebase-tools deploy \
            --only functions,firestore,storage \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }}

  build-expo-prod:
    name: Build & Submit Expo (EAS) — Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build and submit to stores
        run: eas build --platform all --profile production --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
